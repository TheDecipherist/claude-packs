<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" width="760" height="526" role="img" aria-label="Before and after on one row for 7 measures, 1.9 against 2.0, with the factor at the end">
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style>
  <rect width="760" height="526" fill="#fcfcfb"/>
  <text x="24" y="26" font-size="16" font-weight="600" fill="#0b0b0b">claude-packs 1.9 against 2.0, where it counts</text>
  <rect x="24" y="36" width="10" height="10" rx="2" fill="#eb6834"/><text x="40" y="45" font-size="12" fill="#52514e">1.9</text>
  <rect x="80" y="36" width="10" height="10" rx="2" fill="#2a78d6"/><text x="96" y="45" font-size="12" fill="#52514e">2.0 (each row on its own scale; shorter is faster)</text>
  <text x="24" y="64" font-size="14" fill="#0b0b0b">Hook wait per turn (Stop p50 + prompt p50)</text>
  <rect x="24" y="72" width="380" height="12" rx="4" fill="#eb6834"/>
  <text x="412" y="83" font-size="12" fill="#52514e">326 ms</text>
