  <text x="736" y="363" font-size="18" font-weight="600" text-anchor="end" fill="#0b0b0b">3.6x</text>
  <text x="24" y="394" font-size="14" fill="#0b0b0b">doctor, cached</text>
  <rect x="24" y="402" width="380" height="12" rx="4" fill="#eb6834"/>
  <text x="412" y="413" font-size="12" fill="#52514e">4.5 s</text>
