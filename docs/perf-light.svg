  <text x="185" y="99" font-size="12" fill="#52514e">131 ms</text>
  <text x="736" y="99" font-size="18" font-weight="600" text-anchor="end" fill="#0b0b0b">2.5x</text>
  <text x="24" y="130" font-size="14" fill="#0b0b0b">Stop at p95 (replay)</text>
  <rect x="24" y="138" width="380" height="12" rx="4" fill="#eb6834"/>
  <text x="412" y="149" font-size="12" fill="#52514e">6,067 ms</text>
