  <text x="37" y="165" font-size="12" fill="#52514e">77 ms</text>
  <text x="736" y="165" font-size="18" font-weight="600" text-anchor="end" fill="#0b0b0b">79x</text>
  <text x="24" y="196" font-size="14" fill="#0b0b0b">Release, commit to npm (one-hook change)</text>
  <rect x="24" y="204" width="380" height="12" rx="4" fill="#eb6834"/>
  <text x="412" y="215" font-size="12" fill="#52514e">937 s</text>
  <rect x="24" y="220" width="12" height="12" rx="4" fill="#2a78d6"/>
  <text x="44" y="231" font-size="12" fill="#52514e">29.5 s</text>
  <text x="736" y="231" font-size="18" font-weight="600" text-anchor="end" fill="#0b0b0b">32x</text>
