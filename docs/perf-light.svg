  <text x="58" y="297" font-size="12" fill="#52514e">12.9 s</text>
  <text x="736" y="297" font-size="18" font-weight="600" text-anchor="end" fill="#0b0b0b">15x</text>
  <text x="24" y="328" font-size="14" fill="#0b0b0b">A Bash call's hooks, live (Pre p50, wall to wall)</text>
  <rect x="24" y="336" width="380" height="12" rx="4" fill="#eb6834"/>
  <text x="412" y="347" font-size="12" fill="#52514e">105 ms</text>
  <rect x="24" y="352" width="105" height="12" rx="4" fill="#2a78d6"/>
